[project]
name = "wmbgbot"
version = "0.1.0"
description = "Telegram bot for board game lending among friends"
readme = "README.md"
authors = [
    { name = "Eduard Olteanu", email = "eduardolteanu@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot[job-queue]>=20.0,<22.0",
    "python-dotenv>=1.0",
    "httpx>=0.25",
]

[project.scripts]
wmbgbot = "wmbgbot.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
